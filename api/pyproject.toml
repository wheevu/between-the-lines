[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "between-the-lines-api"
version = "0.1.0"
description = "Local API for ambiguity-aware multilingual news translation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-genai>=1.30,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sentence-transformers>=5,<6",
  "torch>=2.7,<3",
  "trafilatura>=2.0,<3",
  "transformers>=4.55,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]
openvino = [
  "sentence-transformers[openvino]>=5,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
