<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#faf7f2">
    <meta
      name="description"
      content="Between the Lines (btl): deterministic EN/VI/KO translation drift, revision diffing, wire clustering, and passage ranking."
    >
    <title>Between the Lines</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="sheet">
      <header class="masthead">
        <div>
          <h1>Between the Lines</h1>
          <p class="subtitle">
            Six real runs from <code>btl</code>, a local zero-LLM verification tool. Text on the
            left, audit flags on the right.
          </p>
        </div>
        <a class="repo-link" href="https://github.com/wheevu/between-the-lines">GitHub ↗</a>
      </header>

      <nav class="tabs" id="tabs" role="tablist" aria-label="Recorded verification runs"></nav>

      <main class="desk" aria-live="polite">
        <section class="left-col" aria-labelledby="case-heading">
          <h2 id="case-heading">Loading…</h2>
          <div class="manuscript" id="manuscript"></div>
          <details class="raw-drawer">
            <summary>CLI &amp; JSON</summary>
            <div class="drawer-body">
              <pre class="cmd-line" id="cli-command"></pre>
              <pre class="json-dump" id="json-output"></pre>
            </div>
          </details>
        </section>

        <aside class="margin-col" aria-label="Audit findings">
          <div class="verdict" id="verdict"></div>
          <div class="notes" id="notes"></div>
        </aside>
      </main>
    </div>
  </body>
</html>
